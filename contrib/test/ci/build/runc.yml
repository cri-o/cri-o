---
- name: set runc checksum
  set_fact:
    runc_checksums:
      amd64: "sha256:177df879d50c913eb205e898d5c1c05a18f574053c0ce5524c471208eaf06f6f"
      arm64: "sha256:ca70e7dbd6616ca782a59b5d3ac86909123fdaa9fa3f89dcf29051c70eee7ce9"

- name: download prebuilt runc binary
  get_url:
    url: "https://github.com/opencontainers/runc/releases/download/{{ runc_git_version }}/runc.{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
    dest: /usr/sbin/runc
    mode: "0755"
    force: yes
    checksum: "{{ runc_checksums[ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64')] }}"

- name: link runc
  file:
    src: /usr/sbin/runc
    dest: /usr/bin/runc
    state: link
    force: yes
