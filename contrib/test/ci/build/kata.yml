---
- name: retrieve kvm module name
  block:
    - name: retrieve kvm module name (x86_64 arch)
      set_fact:
        kvm_mod_name: kvm_intel
      when: ansible_architecture == "x86_64"

    - name: retrieve kvm module name (s390x arch)
      set_fact:
        kvm_mod_name: kvm
      when: ansible_architecture == "s390x"

    - block:
        - name: retrieve kvm module name (unknown arch)
          debug:
            msg: "{{ ansible_architecture }} arch, guessing kvm module as 'kvm'"

        - set_fact:
            kvm_mod_name: kvm

      when: kvm_mod_name is undefined

- name: check nested virtualization
  block:
    - name: ensure kvm module is loaded
      block:
        - name: ensure kvm module is loaded
          command: modprobe {{ kvm_mod_name|quote }}
          register: result

        - fail:
            msg: Cannot load {{ kvm_mod_name }} module
          when: result.rc != 0

    - name: ensure nested virtualization is enabled
      block:
        - name: check nested virtualization is enabled
          command: cat /sys/module/{{ kvm_mod_name }}/parameters/nested
          register: result

        - name: reload kvm module
          block:
            - name: unload kvm module
              command: modprobe -r {{ kvm_mod_name|quote }}

            - name: load kvm module with parameters
              command: modprobe {{ kvm_mod_name|quote }} nested=1

            - name: check nested virtualization activation
              command: cat /sys/module/{{ kvm_mod_name }}/parameters/nested
              register: nested

            - fail:
                msg: Cannot enable nested virtualization
              when: nested.stdout != "Y" and nested.stdout != "1"
          # You will find "Y" in Fedora and "1" in CentOS 8
          when: result.stdout != "Y" and result.stdout != "1"

- name: Install Kata Containers
  block:
    - name: Install zstd for kata tarball extraction
      package:
        name: zstd
        state: present

    - name: Download kata tarball from upstream release
      get_url:
        url: "https://github.com/kata-containers/kata-containers/releases/download/{{ kata_version }}/{{ kata_runtime_variant }}-{{ kata_version }}-amd64.tar.zst"
        dest: "/tmp/{{ kata_runtime_variant }}-{{ kata_version }}-amd64.tar.zst"
        checksum: "{{ kata_amd64_checksum }}"

    - name: Extract kata tarball
      command: tar -I zstd -xf /tmp/{{ kata_runtime_variant }}-{{ kata_version }}-amd64.tar.zst -C /

    - name: Remove kata tarball
      file:
        path: "/tmp/{{ kata_runtime_variant }}-{{ kata_version }}-amd64.tar.zst"
        state: absent

- name: Set debugging logs
  block:
    - name: Edit Kata Containers config to enable debug log level
      replace:
        path: "{{ kata_config_path }}"
        regexp: "^#enable_debug = true"
        replace: "enable_debug = true"

- name: Set up kata-remote (peer pods) environment
  block:
    - name: Install libvirt and QEMU
      become: yes
      package:
        name:
          - podman
          - qemu-kvm
          - libvirt
          - libvirt-client
          - virt-install
          - edk2-ovmf
        state: present

    - name: Start and enable libvirtd
      become: yes
      systemd:
        name: libvirtd
        state: started
        enabled: yes

    - name: Configure libvirt storage pool
      become: yes
      shell: |
        virsh pool-define-as default dir --target /var/lib/libvirt/images || true
        virsh pool-autostart default
        virsh pool-start default || true
      args:
        executable: /bin/bash

    - name: Configure libvirt default network
      become: yes
      shell: |
        virsh net-start default || true
        virsh net-autostart default
      args:
        executable: /bin/bash

    - name: Create required directories
      become: yes
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - /run/peerpod
        - /run/netns
        - /opt/data-dir

    - name: Create xtables lock file
      become: yes
      file:
        path: /run/xtables.lock
        state: touch

    - name: Enable SSH root login for libvirt access
      become: yes
      shell: |
        sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
        systemctl restart sshd
      args:
        executable: /bin/bash

    - name: Generate SSH key for libvirt access
      become: yes
      shell: |
        ssh-keygen -t rsa -N "" -f /root/.ssh/id_rsa
        cat /root/.ssh/id_rsa.pub >> /root/.ssh/authorized_keys
        chmod 700 /root/.ssh
        chmod 600 /root/.ssh/authorized_keys
        restorecon -Rv /root/.ssh/
        ssh-keyscan -H 192.168.122.1 >> /root/.ssh/known_hosts 2>/dev/null || true
      args:
        executable: /bin/bash
        creates: /root/.ssh/id_rsa

    - name: Verify SSH connectivity to libvirt host
      become: yes
      shell: ssh -o StrictHostKeyChecking=no root@192.168.122.1 'virsh version'
      args:
        executable: /bin/bash

    - name: Download oras CLI
      get_url:
        url: "https://github.com/oras-project/oras/releases/download/v{{ oras_version }}/oras_{{ oras_version }}_linux_amd64.tar.gz"
        dest: "/tmp/oras-{{ oras_version }}.tar.gz"
        checksum: "{{ oras_amd64_checksum }}"

    - name: Install oras CLI
      become: yes
      command: tar -xzf /tmp/oras-{{ oras_version }}.tar.gz -C /usr/local/bin oras
      args:
        creates: /usr/local/bin/oras

    - name: Pull and extract podvm image
      become: yes
      shell: |
        set -euo pipefail

        workdir=$(mktemp -d)
        trap 'rm -rf "$workdir"' EXIT

        # The podvm is published as an OCI artifact (not a container image).
        # Its rootfs is an immutable squashfs+dm-verity image, so it cannot
        # be modified with virt-customize. No injection is needed: the image
        # mounts the NoCloud ISO the CAA libvirt provider attaches (by label
        # "cidata") at /media/cidata via a process-user-data.service drop-in.
        /usr/local/bin/oras pull {{ podvm_image }} -o "$workdir"

        if [ -f "$workdir/podvm.tar.xz" ]; then
          tar -xJf "$workdir/podvm.tar.xz" -C "$workdir"
        fi

        QCOW=$(find "$workdir" -maxdepth 1 -name '*.qcow2' -print -quit)
        if [ -z "$QCOW" ]; then
          echo "no qcow2 found in {{ podvm_image }}" >&2
          ls -l "$workdir" >&2
          exit 1
        fi

        virsh vol-create-as --pool default --name podvm-base.qcow2 \
          --capacity 20G --allocation 2G --prealloc-metadata --format qcow2 || true
        virsh vol-upload --vol podvm-base.qcow2 "$QCOW" --pool default --sparse
      args:
        executable: /bin/bash

    - name: Start Cloud API Adaptor container
      become: yes
      shell: |
        podman pull {{ caa_image }}
        podman run -d \
          --name caa \
          --network host \
          --security-opt label=disable \
          --cap-add NET_ADMIN \
          --cap-add SYS_ADMIN \
          --device /dev/kvm \
          -e CLOUD_PROVIDER=libvirt \
          -e LIBVIRT_URI="qemu+ssh://root@192.168.122.1/system?no_verify=1" \
          -e LIBVIRT_POOL=default \
          -e LIBVIRT_NET=default \
          -e LIBVIRT_VOL_NAME=podvm-base.qcow2 \
          -e DISABLECVM=true \
          -e LIBVIRT_EFI_FIRMWARE=/usr/share/edk2/ovmf/OVMF_CODE.fd \
          -v /root/.ssh/id_rsa:/root/.ssh/id_rsa:ro \
          -v /run/peerpod:/run/peerpod \
          -v /run/netns:/run/netns:rslave \
          -v /run/xtables.lock:/run/xtables.lock \
          -v /lib/modules:/lib/modules:ro \
          -v /opt/data-dir:/opt/data-dir \
          {{ caa_image }}
        sleep 5
        podman ps -a --filter name=caa
        podman logs caa 2>&1 | tail -30
      args:
        executable: /bin/bash

    - name: Stream CAA logs to artifact file
      become: yes
      shell: |
        mkdir -p /tmp/artifacts
        nohup podman logs -f caa >> /tmp/artifacts/caa.log 2>&1 &
        echo $! > /tmp/caa_log_pid
      args:
        executable: /bin/bash
