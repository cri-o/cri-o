name: integration
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*
      - update-nixpkgs-*
  pull_request:
    # Codecov carries the integration coverage forward for skipped runs.
    paths-ignore:
      - "**.md"
      - docs/**
env:
  CONMON_BINARY: /usr/local/bin/conmon # from: scripts/github-actions-setup
  # Number of shards for the parallel tests of each integration run. The
  # serial tests run in a separate shard. See TEST_SHARD in test/test_runner.sh.
  INTEGRATION_SHARDS: 6
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shards:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.shards.outputs.list }}
    steps:
      - id: shards
        run: |
          echo "list=$(jq -cn --argjson n "$INTEGRATION_SHARDS" '[range(1; $n + 1) | "\(.)/\($n)"] + ["serial"]')" >>"$GITHUB_OUTPUT"

  test-binaries:
    strategy:
      fail-fast: false
      matrix:
        run:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    name: binaries / ${{ matrix.run.arch }}
    runs-on: ${{ matrix.run.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-binaries-${{ matrix.run.arch }}-${{ hashFiles('**/go.sum') }}-${{ hashFiles('test') }}
      - run: scripts/github-actions-packages
      - run: GO_BUILDFLAGS="-cover" make all test-binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-binaries-${{ matrix.run.arch }}
          path: |
            bin/crio
            bin/pinns
            test/checkcriu/checkcriu
            test/checkseccomp/checkseccomp
            test/copyimg/copyimg
            test/updateunified/updateunified
            test/nri/nri.test

  # Build the test tools from source once per architecture, see
  # scripts/github-actions-setup.
  tools:
    strategy:
      fail-fast: false
      matrix:
        run:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    name: tools / ${{ matrix.run.arch }}
    runs-on: ${{ matrix.run.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tools link against the libraries of the runner image and detect
      # their features from the installed packages. cri-tools gets built with
      # the Go version of go.mod.
      - id: env
        run: |
          echo "image=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
          echo "go=$(sed -n 's/^go //p' go.mod)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: build/tools
          key: tools-${{ matrix.run.arch }}-${{ steps.env.outputs.image }}-go${{ steps.env.outputs.go }}-${{ hashFiles('scripts/versions', 'scripts/github-actions-packages', 'scripts/github-actions-setup') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/github-actions-packages
      - if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/github-actions-setup build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-${{ matrix.run.arch }}
          path: build/tools
          retention-days: 1
          overwrite: true

  integration:
    needs: [shards, test-binaries, tools]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
        # The runner, runtime type and job name are derived from these values.
        # runc is not tested because of AppArmor issues in nested environments,
        # see https://github.com/cri-o/cri-o/issues/9573. Re-enabling it also
        # needs buildah and criu, which the checkpoint tests skip without.
        run:
          - { monitor: conmon, arch: amd64 }
          - { monitor: conmon-rs, arch: amd64 }
          - { monitor: conmon-rs, arch: arm64 }
          - { monitor: conmon, arch: amd64, userns: 1 }
        # critest runs are not sharded. An include entry which overwrites the
        # run of every matrix combination gets added as a new one.
        include:
          - run: { monitor: conmon, arch: amd64, critest: 1 }
          - run: { monitor: conmon-rs, arch: amd64, critest: 1 }
          - run: { monitor: conmon, arch: arm64, critest: 1 }
          - run: { monitor: conmon-rs, arch: arm64, critest: 1 }
    env:
      GOCOVERDIR: ${{ github.workspace }}/build/coverage/bats # It's used to make coverage profiles. https://go.dev/doc/build-cover
    name: >-
      ${{ matrix.run.critest && 'critest' || 'integration' }}
      / ${{ matrix.run.userns && 'userns' || matrix.run.monitor }}
      / crun / ${{ matrix.run.arch }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    runs-on: ${{ matrix.run.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-binaries-${{ matrix.run.arch }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tools-${{ matrix.run.arch }}
          path: build/tools
      - name: Fix artifact permissions
        run: |
          chmod +x \
            bin/crio \
            bin/pinns \
            test/checkcriu/checkcriu \
            test/checkseccomp/checkseccomp \
            test/copyimg/copyimg \
            test/updateunified/updateunified \
            test/nri/nri.test
      - run: scripts/github-actions-packages runtime
      - run: scripts/github-actions-setup
        env:
          RUN_CRITEST: ${{ matrix.run.critest }}
      - name: Run the test suite
        run: sudo -E test/test_runner.sh
        # Below the job timeout, so that the results still get reported.
        timeout-minutes: 12
        env:
          # One parallel test per vCPU of the runners. Higher values cause flakes.
          JOBS: 4
          RUN_CRITEST: ${{ matrix.run.critest }}
          TEST_SHARD: ${{ matrix.shard }}
          RUNTIME_TYPE: ${{ matrix.run.monitor == 'conmon-rs' && 'pod' || 'oci' }}
          TEST_USERNS: ${{ matrix.run.userns }}
          CONTAINER_DEFAULT_RUNTIME: crun
          TEST_REPORT_DIR: ${{ github.workspace }}/build/reports
          TEST_RETRIES: 1
          # Fail hanging tests early. critest runs the whole suite in one test.
          BATS_TEST_TIMEOUT: ${{ !matrix.run.critest && 300 || '' }}
      - name: Summarize the test results
        if: ${{ !cancelled() }}
        run: |
          sudo chown -R $(id -u):$(id -g) build
          scripts/github-actions-test-summary build/reports >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-report-${{ strategy.job-index }}
          path: build/reports
          if-no-files-found: ignore
          retention-days: 7
          # Reruns of a job upload with the same name.
          overwrite: true
      - run: go tool covdata textfmt -i="$GOCOVERDIR" -o build/coverage/coverprofile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ strategy.job-index }}
          path: build/coverage/coverprofile
          retention-days: 1
          overwrite: true

  # Upload the coverage of all integration jobs as a single upload with the
  # integration flag. Skipped if any job failed, Codecov then carries the
  # integration coverage of the parent commit forward.
  coverage:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: build/coverage
      - id: files
        run: echo "files=$(find build/coverage -name coverprofile | sort | paste -sd,)" >>"$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ steps.files.outputs.files }}
          flags: integration
          disable_search: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
