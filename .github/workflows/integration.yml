name: integration
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*
      - update-nixpkgs-*
  pull_request:
env:
  CONMON_BINARY: /usr/local/bin/conmon # from: scripts/github-actions-setup
  # Inputs for the change based test selection (hack/ci).
  GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CI_FORCE_FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci/full') }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Classify the changed files so that jobs which cannot be affected by the
    # change are skipped (see hack/ci/classify-changes.sh). Everything runs on
    # pushes, on workflow_dispatch and for pull requests labeled ci/full.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: classify
        run: hack/ci/classify-changes.sh >> "$GITHUB_OUTPUT"

  test-binaries:
    needs:
      - changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    name: binaries / ${{ matrix.run.arch }}
    runs-on: ${{ matrix.run.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-binaries-${{ matrix.run.arch }}-${{ hashFiles('**/go.sum') }}-${{ hashFiles('test') }}
      - run: scripts/github-actions-packages
      - run: GO_BUILDFLAGS="-cover" make all test-binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-binaries-${{ matrix.run.arch }}
          path: |
            bin/crio
            bin/pinns
            test/checkcriu/checkcriu
            test/checkseccomp/checkseccomp
            test/copyimg/copyimg
            test/updateunified/updateunified
            test/nri/nri.test

  integration:
    needs:
      - changes
      - test-binaries
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        run:
          # TODO: Re-enable runc integration tests when mitigation is found
          # Disabled due to AppArmor issue in nested environments
          # See: https://github.com/cri-o/cri-o/issues/9573
          # See: https://github.com/opencontainers/runc/issues/4968
          # - name: critest / conmon / runc / amd64
          #   arch: amd64
          #   runner: ubuntu-latest
          #   defaultRuntime: runc
          #   runtimeType: oci
          #   critest: 1
          #   userns: 0
          #   jobs: 1
          #   timeout: 20

          - name: critest / conmon / crun / amd64
            arch: amd64
            runner: ubuntu-latest
            defaultRuntime: crun
            runtimeType: oci
            critest: 1
            userns: 0
            jobs: 1
            timeout: 20

          # - name: critest / conmon-rs / runc / amd64
          #   arch: amd64
          #   runner: ubuntu-latest
          #   defaultRuntime: runc
          #   runtimeType: pod
          #   critest: 1
          #   userns: 0
          #   jobs: 1
          #   timeout: 20

          - name: critest / conmon-rs / crun / amd64
            arch: amd64
            runner: ubuntu-latest
            defaultRuntime: crun
            runtimeType: pod
            critest: 1
            userns: 0
            jobs: 1
            timeout: 20

          # - name: critest / conmon / runc / arm64
          #   arch: arm64
          #   runner: ubuntu-24.04-arm
          #   defaultRuntime: runc
          #   runtimeType: oci
          #   critest: 1
          #   userns: 0
          #   jobs: 1
          #   timeout: 20

          - name: critest / conmon / crun / arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            defaultRuntime: crun
            runtimeType: oci
            critest: 1
            userns: 0
            jobs: 1
            timeout: 20

          # - name: critest / conmon-rs / runc / arm64
          #   arch: arm64
          #   runner: ubuntu-24.04-arm
          #   defaultRuntime: runc
          #   runtimeType: pod
          #   critest: 1
          #   userns: 0
          #   jobs: 1
          #   timeout: 20

          - name: critest / conmon-rs / crun / arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            defaultRuntime: crun
            runtimeType: pod
            critest: 1
            userns: 0
            jobs: 1
            timeout: 20

          # - name: integration / conmon / runc / amd64
          #   arch: amd64
          #   runner: ubuntu-latest
          #   defaultRuntime: runc
          #   runtimeType: oci
          #   critest: 0
          #   userns: 0
          #   jobs: 2
          #   timeout: 120

          - name: integration / conmon / crun / amd64
            arch: amd64
            runner: ubuntu-latest
            defaultRuntime: crun
            runtimeType: oci
            critest: 0
            userns: 0
            jobs: 2
            timeout: 120

          - name: integration / conmon / crun / arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            defaultRuntime: crun
            runtimeType: oci
            critest: 0
            userns: 0
            jobs: 2
            timeout: 120

          - name: integration / conmon-rs / crun / amd64
            arch: amd64
            runner: ubuntu-latest
            defaultRuntime: crun
            runtimeType: pod
            critest: 0
            userns: 0
            jobs: 2
            timeout: 120

          - name: integration / userns / crun / amd64
            arch: amd64
            runner: ubuntu-latest
            defaultRuntime: crun
            runtimeType: oci
            critest: 0
            userns: 1
            jobs: 2
            timeout: 120
    env:
      GOCOVERDIR: ${{ github.workspace }}/build/coverage/bats # It's used to make coverage profiles. https://go.dev/doc/build-cover
    name: ${{ matrix.run.name }}
    runs-on: ${{ matrix.run.runner }}
    timeout-minutes: ${{ matrix.run.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.run.name }}-${{ matrix.run.arch }}-${{ hashFiles('**/go.sum') }}-${{ hashFiles('scripts/versions') }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-binaries-${{ matrix.run.arch }}
      - name: Fix artifact permissions
        run: |
          chmod +x \
            bin/crio \
            bin/pinns \
            test/checkcriu/checkcriu \
            test/checkseccomp/checkseccomp \
            test/copyimg/copyimg \
            test/updateunified/updateunified \
            test/nri/nri.test
      - run: scripts/github-actions-packages
      - run: scripts/github-actions-setup
      - name: Switch to runc instead of crun
        if: ${{ matrix.run.defaultRuntime == 'runc' }}
        run: |
          sudo ln -sf $(command -v runc) $(command -v crun)
          crun --version
      - name: Select affected tests
        # Only the bats files whose coverage intersects the changed packages
        # run for pull requests, see hack/ci/select-bats.sh. "ALL" runs the
        # full suite. critest is never subject to selection.
        id: select
        if: ${{ matrix.run.critest != 1 }}
        run: |
          files=$(hack/ci/select-bats.sh | tr '\n' ' ' | xargs)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [[ -z $files ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the test suite
        if: ${{ steps.select.outputs.skip != 'true' }}
        run: sudo -E test/test_runner.sh
        env:
          JOBS: ${{ matrix.run.jobs }}
          RUN_CRITEST: ${{ matrix.run.critest }}
          RUNTIME_TYPE: ${{ matrix.run.runtimeType }}
          TEST_USERNS: ${{ matrix.run.userns }}
          CONTAINER_DEFAULT_RUNTIME: ${{ matrix.run.defaultRuntime }}
          CRIO_BATS_FILES: ${{ steps.select.outputs.files }}
          BATS_REPORT_DIR: ${{ github.workspace }}/build/reports
      - name: Fix build directory permissions
        if: always()
        run: sudo chown -R $(id -u):$(id -g) build || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # Artifact names must not contain slashes, unlike matrix.run.name.
          name: junit-${{ matrix.run.critest == 1 && 'critest' || 'integration' }}-${{ matrix.run.runtimeType }}-${{ matrix.run.defaultRuntime }}-${{ matrix.run.arch }}${{ matrix.run.userns == 1 && '-userns' || '' }}
          path: build/reports/junit_bats_*.xml
          if-no-files-found: ignore
      # Codecov
      - name: Convert the coverage data
        id: coverage
        if: ${{ steps.select.outputs.skip != 'true' }}
        run: |
          if compgen -G "$GOCOVERDIR/covmeta.*" > /dev/null; then
            go tool covdata textfmt -i="$GOCOVERDIR" -o build/coverage/coverprofile
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ steps.coverage.outputs.available == 'true' }}
        with:
          files: build/coverage/coverprofile
          flags: integration
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
